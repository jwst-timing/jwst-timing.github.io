# JWST Timing Consortium publications, NEWEST FIRST.
# To add a paper, copy one block, paste it at the top, and edit. See README.md.
# Fields: year, authors (as you want them shown), title, journal, and any of arxiv / doi / url.
# "summary" is optional: one plain-language sentence shown under the title.

- year: 2026
  authors: Santos-Sanz, P., et al.
  title: JWST stellar occultation reveals unexpected changes in Chariklo's ring system
  journal: Science Advances, 12 (37)
  doi: 10.1126/sciadv.aeh4794
  arxiv: 2510.06366
  summary: The first stellar occultation planned and observed with JWST shows that the rings of the Centaur Chariklo have changed in just a few years.

- year: 2026
  authors: Gandhi, P., Russell, D. M., et al.
  title: Infrared synchrotron emission in the soft state of GX 339–4 and the mid-infrared/X-ray luminosity plane of black hole X-ray binaries
  journal: MNRAS, 548, stag619
  doi: 10.1093/mnras/stag619
  arxiv: 2510.01338
  summary: JWST/MIRI finds bright, variable mid-infrared emission from GX 339–4 in its disc-dominated soft state, likely synchrotron radiation from the same hot plasma that produces the high-energy X-ray tail.

- year: 2026
  authors: Roemsri, P., McCarver, A., Maccarone, T. J., Shaw, A. W., Gandhi, P., Kaplan, D., Dang, T.
  title: A web-based interactive visualization tool for astronomical time series
  journal: AIP Conf. Proc. 3378, 040001 (APCT 2025)
