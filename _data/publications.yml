- year: 2025
  authors: Borowski, E. S., Hynes, R. I., et al.
  title: The mid-infrared-emitting jet in the black hole V404 Cygni in quiescence
  journal: ApJL, 991, L31
  doi: 10.3847/2041-8213/ae0322
  arxiv: 2506.20536
  summary: Rapid 21 µm flaring seen by JWST, together with simultaneous radio-to-X-ray data, shows the mid-infrared excess of V404 Cyg comes from a jet.

- year: 2025
  authors: Shaw, A. W., Kaplan, D. L., Gandhi, P., et al.
  title: Calibrating the clock of JWST
  journal: AJ, 169, 21
  doi: 10.3847/1538-3881/ad8eb1
  arxiv: 2411.02238
  summary: Eclipses of the double white dwarf ZTF J1539+5027 pin JWST's absolute clock accuracy to 0.12 ± 0.06 s.

- year: 2025
  authors: Gandhi, P., Borowski, E. S., Byrom, J., et al.
  title: "Rapid mid-infrared spectral timing with JWST: GRS 1915+105 during an MIR-bright and X-ray-obscured state"
  journal: MNRAS, 537, 1385
  doi: 10.1093/mnras/staf036
  arxiv: 2406.18637
  summary: Mid-infrared spectral timing of the microquasar GRS 1915+105 reveals ~1% variability on ~1000 s timescales, with the brightest emission line lagging the continuum.
